name: Production Readiness & Privacy Gate

on:
  push:
    branches: ["master", "main", "arena/**"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Verify PWA, Storefront, Patches & Zero-PII Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  deploy-pages:
    name: Deploy Offline-First Studio to GitHub Pages ($0/mo)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
